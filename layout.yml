name: frenchy
title: frenchy-clavier (AZERTY)
short: fc
subtitle: ThinkPad X1 Carbon Gen 6 - ANSI

# Shift + Caps locks the digit row on its Shift level, Caps alone stays Compose.
digits_lock: true

# Levels, in order: base, shift, altgr, altgr+shift.
# "" means the level is free. <name> is a raw keysym (dead keys, space).
keys:
  TLDE: ["@", "²", "³", "½"]
  AE01: ["à", "1", "§", "À"]
  AE02: ["è", "2", "`", "È"]
  AE03: ["é", "3", "&", "É"]
  AE04: ["(", "4", "{", ""]
  AE05: [")", "5", "}", ""]
  AE06: ["\"", "6", "`", "<dead_grave>"]
  AE07: ["'", "7", "’", "<dead_acute>"]
  AE08: ["_", "8", "—", "–"]
  AE09: ["-", "9", "±", ""]
  AE10: ["+", "0", "÷", ""]
  AE11: ["*", "%", "×", ""]
  AE12: ["~", "°", "<dead_tilde>", ""]

  AD01: ["a", "A", "æ", "Æ"]
  AD02: ["z", "Z", "", ""]
  AD03: ["e", "E", "€", ""]
  AD04: ["r", "R", "[", ""]
  AD05: ["t", "T", "]", ""]
  AD06: ["y", "Y", "", ""]
  AD07: ["u", "U", "ù", "Ù"]
  AD08: ["i", "I", "", ""]
  AD09: ["o", "O", "œ", "Œ"]
  AD10: ["p", "P", "", ""]
  AD11: ["<dead_circumflex>", "<dead_diaeresis>", "^", "¨"]
  AD12: ["#", "&", "", ""]
  BKSL: ["\\", "|", "", ""]

  AC01: ["q", "Q", "", ""]
  AC02: ["s", "S", "$", "£"]
  AC03: ["d", "D", "", ""]
  AC04: ["f", "F", "<", "≤"]
  AC05: ["g", "G", ">", "≥"]
  AC06: ["h", "H", "", ""]
  AC07: ["j", "J", "", ""]
  AC08: ["k", "K", "", ""]
  AC09: ["l", "L", "", ""]
  AC10: ["m", "M", "µ", ""]
  AC11: ["/", "|", "", ""]

  AB01: ["w", "W", "", ""]
  AB02: ["x", "X", "", ""]
  AB03: ["c", "C", "ç", "Ç"]
  AB04: ["v", "V", "«", ""]
  AB05: ["b", "B", "»", ""]
  AB06: ["n", "N", "", ""]
  AB07: [".", ".", "·", "…"]
  AB08: [",", ";", "", ""]
  AB09: [":", "=", "", ""]
  AB10: ["?", "!", "", ""]

  SPCE: ["<space>", "<space>", "<U202F>", "<nobreakspace>"]

  CAPS: ["<Multi_key>", "<ISO_Level5_Lock>", "", ""]

  LFSH: ["<Shift_L>", "<Shift_L>", "", ""]
  RTSH: ["<Shift_R>", "<Shift_R>", "", ""]

# Locking through an action, not through the Caps_Lock keysym, keeps the Shift
# keys out of the Lock modifier map, which belongs to the key and not the group.
actions:
  LFSH: ["SetMods(modifiers=Shift,clearLocks)", "LockMods(modifiers=Lock)"]
  RTSH: ["SetMods(modifiers=Shift,clearLocks)", "LockMods(modifiers=Lock)"]

# Keys that must not answer to AltGr, or holding it would swallow the modifier.
types:
  CAPS: TWO_LEVEL
  LFSH: ALPHABETIC
  RTSH: ALPHABETIC

# ISO hardware has one key ANSI does not, and Enter reaches up a row. The key
# left of Enter becomes a second Enter, and the backslash moves left of Maj.
iso:
  keys:
    BKSL: ["<Return>", "", "", ""]
    LSGT: ["\\", "|", "", ""]
  types:
    BKSL: ONE_LEVEL
