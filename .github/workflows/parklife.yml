name: Parklife

on:
  # Run on every push.
  push:
  # Allow manually triggering a build.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests assert what xkeyboard-config answers, and its answers change
    # between releases: Ubuntu ships 2.41, the layout is written against 2.48.
    container: archlinux:latest
    steps:
    # libx11 carries the Compose table the dead keys and how-to-type read.
    - run: pacman -Syu --noconfirm --needed git ruby ruby-minitest ruby-erb libxkbcommon xkeyboard-config libx11
    - uses: actions/checkout@v7
    - run: bin/test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
    - uses: actions/checkout@v7
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: site
    - uses: actions/configure-pages@v6
      id: pages

      # Build with Parklife and use its GitHub Pages URL (either its custom
      # domain or username.github.io/repository).
    - run: bin/static-build --base "${{ steps.pages.outputs.base_url }}"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      if: github.ref == 'refs/heads/main' # Only upload on main branch.
      with:
        path: site/build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [ test, build ]
    if: github.ref == 'refs/heads/main' # Only deploy on main branch.
    concurrency:
      group: deploy
      cancel-in-progress: true
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
